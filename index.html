<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Turn Up the Life</title>
<!--
  ============================================================================
  THE FRONT DOOR — index.html
  ============================================================================
  WHY THIS FILE EXISTS
    GitHub Pages serves index.html for a directory. When there ISN'T one, it
    falls back to rendering README.md as the landing page — which meant the
    template build guide was the public front door of the site. This file
    fixes that. Don't delete it.

  WHY A REDIRECT INSTEAD OF RENAMING course.html
    Every lesson page links back to "course.html" (the homebar, the "To the
    Academy" links, the router hashes). Renaming it to index.html would mean
    hunting down every one of those. A one-file redirect leaves all of them
    working. If you ever DO want to rename, search every .html for
    "course.html" first.

  THREE LAYERS, ON PURPOSE — each one covers a case the others miss:
    1. <meta http-equiv="refresh"> — works with JavaScript switched off.
    2. <link rel="canonical">      — tells search engines the Academy is the
                                     real page, so this one doesn't compete
                                     with it in results.
    3. The <script> below          — fires faster than the meta refresh and
                                     uses location.replace() so the browser's
                                     Back button skips this page instead of
                                     bouncing the visitor back into it.
  A plain link is visible underneath for anyone the above doesn't cover.

  IF YOU ADD A REAL LANDING PAGE LATER
    (sales copy, an email capture, a trailer) — build it right here, in this
    file, and drop the redirect. This is the correct home for it.
  ============================================================================
-->
<meta http-equiv="refresh" content="0; url=course.html">
<link rel="canonical" href="https://turnupthelife.com/course.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --paper:#FFF7EA;--ink:#26140A;--ink-2:#7E6A54;
    --sun:#FFB300;--aqua:#12A14B;--pink:#D62828;--lime:#93D500;--coral:#E8500F;
    --display:'Archivo',system-ui,sans-serif;
    --body:'Newsreader',Georgia,serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  body{overflow-x:clip;margin:0;min-height:100vh;display:flex;flex-direction:column;
       align-items:center;justify-content:center;text-align:center;padding:24px;
       background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;}
  .stripe{position:fixed;top:0;left:0;right:0;height:5px;
          background:linear-gradient(90deg,var(--sun),var(--coral) 28%,var(--pink) 52%,var(--aqua) 76%,var(--lime));}
  .kick{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.18em;
        text-transform:uppercase;color:var(--coral);margin-bottom:18px;}
  h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,9vw,60px);
     line-height:.9;letter-spacing:-.03em;margin:0 0 18px;text-transform:uppercase;}
  .shine{background:linear-gradient(100deg,var(--sun),var(--coral) 28%,var(--pink) 55%,var(--aqua) 85%);
         -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
  p{margin:0 0 24px;color:var(--ink-2);max-width:34ch;}
  a.go{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;
       font-weight:700;letter-spacing:.09em;text-transform:uppercase;text-decoration:none;
       background:var(--sun);color:var(--ink);border:2px solid var(--ink);padding:15px 24px;}
  a.go:hover{background:var(--ink);color:var(--paper);}
</style>
</head>
<body>
  <div class="stripe"></div>
  <span class="kick">Turn Up the Life</span>
  <h1>Taking you<br><span class="shine">inside.</span></h1>
  <p>One moment — opening the Academy.</p>
  <a class="go" href="course.html">Enter the Academy &rarr;</a>
<script>
  // Fires before the meta refresh. replace() keeps this page out of history,
  // so Back doesn't bounce the visitor straight back here.
  window.location.replace('course.html');
</script>
</body>
</html>
